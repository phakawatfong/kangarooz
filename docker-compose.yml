# Phase 1 local stack: one Redpanda broker (Kafka API + built-in Schema Registry) + Redpanda Console.
# Single node, replication factor 1 = laptop dev profile (production design assumes RF=3).
name: f1

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION}
    container_name: f1-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --default-log-level=info
    ports:
      - "19092:19092"   # Kafka API (host)
      - "18081:18081"   # Schema Registry (host)
      - "18082:18082"   # HTTP proxy (host)
      - "19644:9644"    # Admin API (host)
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: create topics with the Phase 1 sizing decisions.
  # (Week 5 moves this into OpenTofu as platform-as-code.)
  init-topics:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION}
    container_name: f1-init-topics
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        B="-X brokers=redpanda:9092"
        # 6 partitions: parallelism, not throughput (throughput needs only 1).
        # 24h retention: dev profile (~15 GB/day at the dev rate; 7 days would be ~105 GB).
        rpk topic create fx.trades $$B -p 6 -r 1 -c retention.ms=86400000 -c compression.type=producer || true
        # Ground truth is tiny; keep it a week so grading can look back.
        rpk topic create fx.trades.ground_truth $$B -p 1 -r 1 -c retention.ms=604800000 || true
        rpk topic list $$B
    restart: "no"

  console:
    image: docker.redpanda.com/redpandadata/console:${CONSOLE_VERSION}
    container_name: f1-console
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8080:8080"

volumes:
  redpanda-data:
