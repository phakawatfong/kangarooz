[project]
name = "f1-project"
version = "0.1.0"
description = "F1: real-time FX trading analytics platform. Phase 1 = trade event contract + synthetic producer."
readme = "README.md"
authors = [{ email = "phakawatfong@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.6",
    "pydantic>=2.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
